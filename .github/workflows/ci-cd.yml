name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    name: Typecheck + test e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_office_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/hermes_office_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test e2e (build + server + Hermes tiruan)
        run: npm test
      - name: Simpan log server bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-test
          path: |
            .output/**/*.log
          if-no-files-found: ignore

  deploy:
    name: Deploy Railway
    needs: uji
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy
        run: railway up --service "${{ vars.RAILWAY_SERVICE || 'hermes-office' }}" --detach
